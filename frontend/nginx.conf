server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend container so the browser only
    # ever talks to this origin (no CORS needed, no VITE_API_BASE_URL to set).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Agent endpoints (plan generation, preview, run, chat) call a local
        # LLM synchronously and can legitimately take well over nginx's
        # 60s default — without this, nginx returns a 504 to the browser
        # while the backend request keeps running to completion behind it
        # (so the sync/agent still finishes and, for scheduled/agent runs,
        # still reports to Telegram — just with no way for the UI to show
        # the real result). 300s comfortably covers the biggest LLM calls
        # this app makes (planner/selector time out internally at 180s).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: fall back to index.html for client-side routes. index.html
    # references content-hashed asset filenames, so it must never be cached —
    # otherwise browsers can keep serving a stale build after a redeploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
